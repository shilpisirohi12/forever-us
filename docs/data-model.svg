<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Forever Us couple-scoped data model</title><desc id="desc">A couples table owns profiles and all feature tables. Row-level security scopes access through profiles.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100c18"/><stop offset="1" stop-color="#231127"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#f9a8d4"/></marker></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/><text x="55" y="62" fill="#fff1f2" font-family="Arial" font-size="29" font-weight="700">Forever Us · couple-scoped data model</text><text x="55" y="92" fill="#f9a8d4" font-family="Arial" font-size="15">Every shared row is linked to a couple_id and protected by membership policies.</text>
  <g font-family="Arial"><rect x="465" y="125" width="270" height="96" rx="18" fill="#4c1d3a" stroke="#f472b6"/><text x="600" y="164" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">couples</text><text x="600" y="194" text-anchor="middle" fill="#fbcfe8" font-size="14">id · code · partner settings · points</text>
  <rect x="80" y="290" width="220" height="92" rx="16" fill="#172554" stroke="#60a5fa"/><text x="190" y="327" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">profiles</text><text x="190" y="354" text-anchor="middle" fill="#bfdbfe" font-size="13">auth user · role · couple_id</text>
  <rect x="365" y="290" width="220" height="92" rx="16" fill="#3f1523" stroke="#fb7185"/><text x="475" y="327" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">love_inbox</text><text x="475" y="354" text-anchor="middle" fill="#fecdd3" font-size="13">messages + reactions</text>
  <rect x="650" y="290" width="220" height="92" rx="16" fill="#3f1523" stroke="#fb7185"/><text x="760" y="327" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">games_*</text><text x="760" y="354" text-anchor="middle" fill="#fecdd3" font-size="13">bingo · dice · spoil me</text>
  <rect x="935" y="290" width="220" height="92" rx="16" fill="#3f1523" stroke="#fb7185"/><text x="1045" y="327" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">date_night_ideas</text><text x="1045" y="354" text-anchor="middle" fill="#fecdd3" font-size="13">bucket list + memories</text>
  <rect x="220" y="490" width="245" height="92" rx="16" fill="#3f1523" stroke="#fb7185"/><text x="343" y="527" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">private_*</text><text x="343" y="554" text-anchor="middle" fill="#fecdd3" font-size="13">cards · desire matcher · dice</text>
  <rect x="535" y="490" width="245" height="92" rx="16" fill="#3f1523" stroke="#fb7185"/><text x="658" y="527" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">love_rewards</text><text x="658" y="554" text-anchor="middle" fill="#fecdd3" font-size="13">coupons + redemptions</text>
  <rect x="850" y="490" width="245" height="92" rx="16" fill="#32213f" stroke="#c084fc"/><text x="973" y="527" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">couple_state</text><text x="973" y="554" text-anchor="middle" fill="#e9d5ff" font-size="13">recovery / audit snapshot</text></g>
  <g stroke="#f9a8d4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M535 221L218 280"/><path d="M570 221L492 280"/><path d="M630 221L745 280"/><path d="M680 221L1010 280"/><path d="M505 221L355 478"/><path d="M600 221L650 478"/><path d="M695 221L950 478"/></g><text x="600" y="650" text-anchor="middle" fill="#f9a8d4" font-family="Arial" font-size="15">Feature tables are canonical; couple_state is retained as a recovery/audit snapshot.</text>
</svg>
