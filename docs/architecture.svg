<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Forever Us system architecture</title><desc id="desc">Two authenticated partners use a Next.js application hosted on Vercel, which stores secure couple-scoped data in Supabase.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160b19"/><stop offset="1" stop-color="#32101d"/></linearGradient><linearGradient id="accent"><stop stop-color="#f43f5e"/><stop offset="1" stop-color="#ec4899"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#f9a8d4"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="60" y="70" fill="#fff1f2" font-family="Arial, sans-serif" font-size="30" font-weight="700">Forever Us · runtime architecture</text><text x="60" y="102" fill="#f9a8d4" font-family="Arial, sans-serif" font-size="16">Couple-scoped application data, authenticated by Supabase and deployed on Vercel.</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="220" height="190" rx="22" fill="#3f1523" stroke="#fb7185"/><text x="180" y="238" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Partner devices</text><text x="180" y="272" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="15">Gautam · Shilpi</text><text x="180" y="304" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="15">Browser + Google sign-in</text><text x="180" y="336" text-anchor="middle" fill="#fecdd3" font-family="Arial" font-size="15">One shared couple space</text></g>
  <g filter="url(#shadow)"><rect x="430" y="150" width="340" height="250" rx="22" fill="#311326" stroke="#f472b6"/><rect x="430" y="150" width="340" height="50" rx="22" fill="url(#accent)"/><text x="600" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Next.js app · Vercel</text><text x="600" y="243" text-anchor="middle" fill="#fce7f3" font-family="Arial" font-size="16">App Router + React 19</text><text x="600" y="278" text-anchor="middle" fill="#fce7f3" font-family="Arial" font-size="16">Tailwind UI + local resilience</text><text x="600" y="313" text-anchor="middle" fill="#fce7f3" font-family="Arial" font-size="16">Session inactivity logout</text><text x="600" y="348" text-anchor="middle" fill="#fce7f3" font-family="Arial" font-size="16">Feature-table synchronization</text></g>
  <g filter="url(#shadow)"><rect x="910" y="120" width="230" height="310" rx="22" fill="#142338" stroke="#60a5fa"/><text x="1025" y="175" text-anchor="middle" fill="#dbeafe" font-family="Arial" font-size="21" font-weight="700">Supabase</text><line x1="940" y1="196" x2="1110" y2="196" stroke="#3b82f6" opacity=".6"/><text x="1025" y="236" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="16">Google OAuth</text><text x="1025" y="276" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="16">Auth + Profiles</text><text x="1025" y="316" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="16">Postgres + RLS</text><text x="1025" y="356" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="16">Couple-scoped records</text></g>
  <path d="M290 275H415" stroke="#f9a8d4" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 275H895" stroke="#f9a8d4" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="258" text-anchor="middle" fill="#fbcfe8" font-family="Arial" font-size="13">HTTPS</text><text x="833" y="258" text-anchor="middle" fill="#fbcfe8" font-family="Arial" font-size="13">Supabase client</text>
  <text x="600" y="500" text-anchor="middle" fill="#f9a8d4" font-family="Arial" font-size="15">RLS ensures an authenticated person can only access the couple space linked to their profile.</text>
</svg>
